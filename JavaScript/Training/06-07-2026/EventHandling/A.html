<!DOCTYPE html>
<html>
<head>

    <style>
        div{
            border:2px solid black;
            padding:20px;

        }
        li{

        }

</head>
<body>

</div>

<!-- Event Delegation -->

    <li>HTML</li>
    <li>CSS</li>
    <li>JavaScript</li>
</ul>

<script src="A.js"></script>

</body>
</html>
