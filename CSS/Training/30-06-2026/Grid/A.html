<!DOCTYPE html>
<html>
<head>
<style>

.container{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.item{
    background:orange;
    padding:30px;
    text-align:center;
    color:white;
}

</style>
</head>

<body>

<div class="container">
    <div class="item">1</div>
    <div class="item">2</div>
    <div class="item">3</div>
    <div class="item">4</div>
    <div class="item">5</div>
    <div class="item">6</div>
</div>

</body>
</html>
