<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .b1,.b2,.b3,.b4{
            display: grid;
            background-color: brown;
            padding: 20px;
            border: rgb(37, 31, 32) solid;
        }
        #box{
           grid-template-columns: 1fr 1fr  ;
        gap:20px;
        }
        .b1{
             grid-column: 1/3;
        }
        .b4{
            grid-column: 1/3;
        }
    </style>
</head>
<body>
    <div style="display: grid; background-color: rgb(180, 26, 226); border: black solid; " id="box" >
        <div class="b1">Box1</div>
        <div class="b2">Box2</div>
        <div class="b3">Box3</div>
        <div class="b4">Box4</div>
    </div>
</body>
</html>
