<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .a,.b,.c,.d{
            display: grid;
            background-color: brown;
            border: black solid;
            padding: 2px;
        }
        #main{
            grid-template-columns: 1fr 1fr 1fr 1fr  ;

        }
        .a{
            grid-column: 1/5;
        }
    
    </style>
</head>
<body>
    <div style="display: grid;background-color: chocolate; height: 250px; width: 300px; border: black solid;" id="main">
        <div class="a">Apple</div>
        <div class="b">Mango</div>
        <div class="c">Bananna</div>
        <div class="d">Grapes</div>
    </div>
</body>
</html>
