<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Layouts</title>

</head>
<body>

<div class="wrapper">

    <section class="layout">
        <div class="logo">Logo</div>

            <div class="sidebar">Side Bar</div>

            <div class="nav">Navigation</div>

            <div class="box">Box 2</div>
