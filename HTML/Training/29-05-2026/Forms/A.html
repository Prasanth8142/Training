<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    

<form title="Health History checklist">
    
 <h1><mark style="background-color: cornflowerblue;">personal Data</mark></h1>
 <label for="name">Name:</label>
 <input type="text"  id="name" minlength="10" maxlength="15">
 <label for="date">Date of birth:</label>
 <input type="date" id="date"> <br> <br>
 <label for="surname">surname:</label>
 <input type="text" id="surname"> <br> <br>
 <label for="phone">phone:</label>
 <input type="number" id="phone">
 <label for="mail">mail:</label>
 <input type="email" id="mail"> <br><br>
 <label for="address">Address:</label>
 <input type="text" id="address"> <br> <br>
 <label for="Gender">Gender:</label>
 <input type="radio" name="id">male 
 <input type="radio" name="id">Female
 <h1><mark style="background-color: darkmagenta;">Health Report</mark></h1>
 <label for="M">Medications:</label>
 <input type="text" id="M"> <br> <br>
 <label for="D">Diseases:</label>
 <input type="text" id="D">
</form>




</body>
</html>
