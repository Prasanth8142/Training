<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Grid</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      padding: 20px;
    }

    .grid-item {
      overflow: hidden;
      border-radius: 10px;
    }

    .grid-item img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    /* Hover Zoom Effect */
    .grid-item:hover img {
      transform: scale(1.1);
    }

    /* Tablet */
    @media (max-width: 900px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* Mobile */
    @media (max-width: 500px) {
      .grid {
        grid-template-columns: repeat(1, 1fr);
      }
    }
  </style>
</head>
<body>

  <div class="grid">
    <div class="grid-item"><img src="https://picsum.photos/400/300?1"></div>
    <div class="grid-item"><img src="https://picsum.photos/400/300?2"></div>
    <div class="grid-item"><img src="https://picsum.photos/400/300?3"></div>
    <div class="grid-item"><img src="https://picsum.photos/400/300?4"></div>
    <div class="grid-item"><img src="https://picsum.photos/400/300?5"></div>
    <div class="grid-item"><img src="https://picsum.photos/400/300?6"></div>
    <div class="grid-item"><img src="https://picsum.photos/400/300?7"></div>
    <div class="grid-item"><img src="https://picsum.photos/400/300?8"></div>
  </div>

</body>
</html>
